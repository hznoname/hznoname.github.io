<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:linear-gradient(180deg,#090909,#171717);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

}

.container{

    width:100%;
    max-width:420px;

    text-align:center;

    padding:20px;

}

.avatar{

    width:170px;
    height:170px;

    margin:auto;

    border-radius:50%;

    padding:5px;

    background:linear-gradient(
        45deg,
        #00d9ff,
        #6c63ff,
        #ff00ff,
        #00d9ff
    );

    background-size:300%;

    animation:rainbow 5s linear infinite;

    box-shadow:
    0 0 15px #00d9ff,
    0 0 35px #7b2fff;

}

.avatar img{

    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;

    display:block;

}

@keyframes rainbow{

0%{
background-position:0%;
}

100%{
background-position:300%;
}

}

h1{

    margin-top:25px;
    font-size:46px;

}

p{

    margin:15px 0 35px;
    color:#bdbdbd;

}

.link{

display:flex;

justify-content:center;

align-items:center;

width:100%;

height:60px;

margin:18px 0;

text-decoration:none;

color:white;

font-size:20px;

font-weight:bold;

border-radius:16px;

background:#202020;

border:2px solid #2f89ff;

box-shadow:

0 0 10px rgba(47,137,255,.35);

transition:.25s;

}

.link:hover{

transform:translateY(-3px) scale(1.02);

background:#2f89ff;

box-shadow:

0 0 20px #2f89ff,

0 0 45px rgba(47,137,255,.7);

}

.footer{

margin-top:30px;

color:#666;

font-size:13px;

}
